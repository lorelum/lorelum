<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" fill="none" role="img" aria-labelledby="cover-title cover-description">
  <title id="cover-title">Practice injection: a controlled comparison</title>
  <desc id="cover-description">The same coding task is run with no Practice, an unrelated Practice, or a relevant Practice. All three conditions use the same evaluation criteria. This diagram shows the experimental design, not measured results.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="750" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F644C"/>
      <stop offset="1" stop-color="#137C65"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="m2 2 4 3-4 3" stroke="#F0F2F4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="750" fill="url(#ground)"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#F0F2F4">
    <text x="600" y="168" text-anchor="middle" font-size="28" fill-opacity=".85">Three contexts</text>
  </g>
  <g stroke="#F0F2F4" stroke-opacity=".7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M214 375H290M290 250V500"/>
    <path d="M290 250H340M290 375H340M290 500H340"/>
    <path d="M860 250H910M860 375H910M860 500H910M910 250V500"/>
    <path d="M910 375H974" marker-end="url(#arrow)"/>
  </g>
  <g data-stage="task">
    <circle cx="170" cy="375" r="44" fill="#F0F2F4" fill-opacity=".16" stroke="#F0F2F4" stroke-opacity=".7" stroke-width="3"/>
    <text x="170" y="451" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" fill="#F0F2F4" fill-opacity=".85">Same task</text>
  </g>
  <g data-condition="baseline" transform="translate(340 202)">
    <rect width="520" height="96" rx="20" fill="#F0F2F4" fill-opacity=".14" stroke="#F0F2F4" stroke-opacity=".6" stroke-width="2"/>
    <text x="32" y="46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="38" font-weight="700" fill="#F0F2F4">BASELINE</text>
    <text x="32" y="76" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#F0F2F4" fill-opacity=".85">No Practice</text>
  </g>
  <g data-condition="placebo" transform="translate(340 327)">
    <rect width="520" height="96" rx="20" fill="#F0F2F4" fill-opacity=".14" stroke="#F0F2F4" stroke-opacity=".6" stroke-width="2"/>
    <text x="32" y="46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="38" font-weight="700" fill="#F0F2F4">PLACEBO</text>
    <text x="32" y="76" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#F0F2F4" fill-opacity=".85">Unrelated Practice</text>
  </g>
  <g data-condition="oracle" transform="translate(340 452)">
    <rect width="520" height="96" rx="20" fill="#F0F2F4" fill-opacity=".14" stroke="#F0F2F4" stroke-opacity=".6" stroke-width="2"/>
    <text x="32" y="46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="38" font-weight="700" fill="#F0F2F4">ORACLE</text>
    <text x="32" y="76" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#F0F2F4" fill-opacity=".85">Relevant Practice</text>
  </g>
  <g data-stage="evaluation">
    <circle cx="1030" cy="375" r="44" fill="#F0F2F4" fill-opacity=".16" stroke="#F0F2F4" stroke-opacity=".7" stroke-width="3"/>
    <text x="1030" y="451" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" fill="#F0F2F4" fill-opacity=".85">Same criteria</text>
  </g>
  <text x="600" y="598" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" fill="#F0F2F4" fill-opacity=".8">Experimental design · not measured results</text>
</svg>
