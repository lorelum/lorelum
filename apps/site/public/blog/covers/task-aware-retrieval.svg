<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" fill="none" role="img" aria-labelledby="cover-title cover-description">
  <title id="cover-title">Task first. Domain second.</title>
  <desc id="cover-description">A query split into clauses is matched against a Practice task card and body chunks, then ranked in a single pass. The diagram represents the retrieval design, not measured results.</desc>
  <rect width="1200" height="750" fill="#F0F2EB"/>
  <g fill="#17634F" font-family="system-ui, sans-serif">
    <text x="72" y="82" font-size="22" font-weight="600" letter-spacing="3">SEMANTIC / RETRIEVAL</text>
    <text x="68" y="180" font-size="76" font-weight="600" letter-spacing="-3">Task first.</text>
    <text x="68" y="268" font-size="76" font-weight="600" letter-spacing="-3">Domain second.</text>
  </g>

  <g stroke="#B6C9BA" stroke-width="2">
    <path d="M72 326H1128"/>
  </g>

  <!-- query clauses -->
  <g font-family="system-ui, sans-serif">
    <text x="72" y="374" fill="#466B59" font-size="20" font-weight="600" letter-spacing="2">QUERY</text>
    <rect x="72" y="396" width="272" height="58" rx="16" fill="#E1E9DF"/>
    <rect x="72" y="470" width="272" height="58" rx="16" fill="#D3E1D5"/>
    <rect x="72" y="544" width="272" height="58" rx="16" fill="#E1E9DF"/>
    <g stroke="#27785E" stroke-width="6" stroke-linecap="round">
      <path d="M98 425H270"/>
      <path d="M98 499H238"/>
      <path d="M98 573H196"/>
    </g>
    <text x="72" y="650" fill="#466B59" font-size="19" font-weight="500" letter-spacing="1">SPLIT AT PUNCTUATION</text>
  </g>

  <!-- practice views -->
  <g font-family="system-ui, sans-serif">
    <text x="390" y="374" fill="#466B59" font-size="20" font-weight="600" letter-spacing="2">PRACTICE</text>
    <rect x="390" y="396" width="360" height="126" rx="20" fill="#17634F"/>
    <text x="416" y="440" fill="#F0F2EB" font-size="20" font-weight="600" letter-spacing="1">TASK CARD</text>
    <g stroke="#9CC3AE" stroke-width="5" stroke-linecap="round">
      <path d="M416 464H670"/>
      <path d="M416 488H596"/>
    </g>

    <rect x="390" y="538" width="170" height="64" rx="16" fill="#E1E9DF"/>
    <rect x="580" y="538" width="170" height="64" rx="16" fill="#E1E9DF"/>
    <rect x="390" y="618" width="360" height="32" rx="12" fill="#D3E1D5"/>
    <text x="390" y="678" fill="#466B59" font-size="19" font-weight="500" letter-spacing="1">BODY CHUNKS</text>
  </g>

  <!-- ranking -->
  <g font-family="system-ui, sans-serif">
    <text x="806" y="374" fill="#466B59" font-size="20" font-weight="600" letter-spacing="2">ONE RANKING</text>
    <rect x="806" y="396" width="322" height="64" rx="16" fill="#17634F"/>
    <circle cx="838" cy="428" r="12" fill="#F0F2EB"/>
    <rect x="864" y="419" width="210" height="18" rx="9" fill="#9CC3AE"/>
    <rect x="806" y="474" width="322" height="52" rx="14" fill="#E1E9DF"/>
    <rect x="806" y="540" width="322" height="52" rx="14" fill="#E1E9DF"/>
    <rect x="806" y="606" width="322" height="52" rx="14" fill="#E1E9DF"/>
    <g fill="#B6C9BA">
      <rect x="830" y="493" width="160" height="14" rx="7"/>
      <rect x="830" y="559" width="200" height="14" rx="7"/>
      <rect x="830" y="625" width="126" height="14" rx="7"/>
    </g>
  </g>

  <path d="M72 712H1128" stroke="#B6C9BA" stroke-width="2"/>
  <g fill="#466B59" font-family="system-ui, sans-serif" font-size="22" font-weight="500" letter-spacing="2">
    <text x="72" y="740">PURE VECTOR COSINE</text>
    <text x="1128" y="740" text-anchor="end">K APPLIED LAST</text>
  </g>
</svg>
