name: Deploy site

# Production deployment is an explicit release action. Merging to main does not
# publish the site; run this workflow manually after the target ref is verified.
on:
  workflow_dispatch: {}

# One deploy at a time; a newer manual request supersedes an in-progress run.
concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    name: build · deploy to Cloudflare Workers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Scope deployment credentials to the production Environment.
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Bun version pinned per ADR 0002 (packageManager field in package.json).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same pipeline as `bun run build:site` at the repo root.
      - name: Build site
        run: bun run --filter @lorelum/site build

      # Same command as `bun run deploy:site`; direct upload does not consume
      # Workers Builds minutes.
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
