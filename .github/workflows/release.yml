name: Build release

# Build candidates manually. Publishing is opt-in and never runs on a merge.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the verified archives to a draft release
        type: boolean
        default: false
      tag:
        description: New release tag (required when publishing)
        type: string
        default: ''

permissions:
  contents: read

# Do not interrupt an archive build or a release upload on the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build · ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: darwin-arm64
            runner: macos-15
          - target: win32-x64
            runner: windows-2025

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Bun version pinned per ADR 0002 (packageManager field in package.json).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Validate release tag
        if: inputs.publish
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test -n "$RELEASE_TAG"
          git check-ref-format "refs/tags/$RELEASE_TAG"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check release tooling
        # Check source formatting once on LF checkouts; Windows uses CRLF by default.
        if: runner.os == 'Linux'
        run: |
          bun run tsc --noEmit -p scripts/release/tsconfig.json
          bun run oxlint scripts/release/compile-cli.ts
          bun run oxfmt --check scripts/release/compile-cli.ts

      - name: Test release tooling
        run: bun test scripts/native/build-config.test.ts scripts/release/compile-cli.test.ts scripts/release/notices.test.ts

      # Includes the native runtime, embedded manifest, licenses, and checksums.
      - name: Build release archive
        run: bun run build:release

      - name: Verify unpacked archive
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          cd dist/release/artifacts
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 -c SHA256SUMS
          else
            sha256sum -c SHA256SUMS
          fi
          package_root="$RUNNER_TEMP/lorelum-release"
          mkdir -p "$package_root"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            pwsh -NoProfile -Command 'Expand-Archive -Path lore-*.zip -DestinationPath "$env:RUNNER_TEMP/lorelum-release" -ErrorAction Stop'
            cli_name=lore.exe
            native_name=llama-server.exe
          else
            tar -xzf lore-*.tar.gz -C "$package_root"
            cli_name=lore
            native_name=llama-server
          fi
          package_directory=("$package_root"/lore-*)
          cd "${package_directory[0]}"
          "./$cli_name" --version
          "./$cli_name" describe
          "./native/$RELEASE_TARGET/$native_name" --version
          trap '"./$cli_name" backend stop' EXIT
          "./$cli_name" backend start
          "./$cli_name" backend status

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/release/artifacts/
          if-no-files-found: error

  publish:
    name: publish · GitHub draft release
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Maintainers configure required reviewers on this Environment before publishing.
    environment: release
    permissions:
      contents: write

    steps:
      - name: Download verified archives
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          path: artifacts

      # Each target produces files with the same metadata/checksum names.
      # Keep downloads separate, then combine checksums and name metadata by target.
      - name: Collect release assets
        run: |
          mkdir -p release
          for directory in artifacts/release-*; do
            target="${directory##*/release-}"
            cp "$directory"/lore-* release/
            cat "$directory/SHA256SUMS" >> release/SHA256SUMS
            cp "$directory/release-metadata.json" "release/release-metadata-$target.json"
          done
          cd release
          sha256sum -c SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "Lorelum $RELEASE_TAG" \
            --draft \
            --prerelease \
            --notes "Release archives built and smoke-tested on Linux x64, macOS arm64, and Windows x64. Source commit: $GITHUB_SHA."
