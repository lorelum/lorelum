name: Release

# Build candidates manually. Draft creation is opt-in and never runs on a merge.
on:
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create a verified prerelease draft from an existing version tag
        type: boolean
        default: false
      tag:
        description: Existing annotated version tag (required when creating a draft)
        type: string
        default: ""

permissions:
  contents: read

# Do not interrupt an archive build or a draft upload on the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build · ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: darwin-arm64
            runner: macos-15
          - target: win32-x64
            runner: windows-2025

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7.0.1
        with:
          # A draft must package the selected tag, not the workflow's default-branch SHA.
          ref: ${{ inputs.create_draft && inputs.tag || github.sha }}
          fetch-depth: 0

      # Bun version pinned per ADR 0002 (packageManager field in package.json).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Validate release contract
        if: inputs.create_draft
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test -n "$RELEASE_TAG"
          git check-ref-format "refs/tags/$RELEASE_TAG"
          git cat-file -e "refs/tags/$RELEASE_TAG^{tag}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          release_version="$(bun -e 'console.log(require("./packages/cli/package.json").version)')"
          test "$RELEASE_TAG" = "v$release_version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check release tooling
        # Check source formatting once on LF checkouts; Windows uses CRLF by default.
        if: runner.os == 'Linux'
        run: |
          bun run tsc --noEmit -p scripts/release/tsconfig.json
          bun run oxlint scripts/release/compile-cli.ts
          bun run oxfmt --check scripts/release/compile-cli.ts

      - name: Test release tooling
        run: bun test scripts/native/build-config.test.ts scripts/release/assets.test.ts scripts/release/compile-cli.test.ts scripts/release/notices.test.ts

      # Includes the native runtime, embedded manifest, licenses, and checksums.
      - name: Build release archive
        run: bun run build:release

      - name: Verify unpacked archive
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          cd dist/release/artifacts
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 -c SHA256SUMS
          else
            sha256sum -c SHA256SUMS
          fi
          package_root="$RUNNER_TEMP/lorelum-release"
          mkdir -p "$package_root"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            pwsh -NoProfile -Command 'Expand-Archive -Path lore-*.zip -DestinationPath "$env:RUNNER_TEMP/lorelum-release" -ErrorAction Stop'
            cli_name=lore.exe
            native_name=lore-model.exe
          else
            tar -xzf lore-*.tar.gz -C "$package_root"
            cli_name=lore
            native_name=lore-model
          fi
          package_directory=("$package_root"/lore-*)
          cd "${package_directory[0]}"
          "./$cli_name" --version
          "./$cli_name" describe
          "./native/$RELEASE_TARGET/$native_name" --version
          trap '"./$cli_name" backend stop' EXIT
          "./$cli_name" backend start
          "./$cli_name" backend status

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/release/artifacts/
          if-no-files-found: error

  draft:
    name: draft · GitHub prerelease
    needs: build
    if: inputs.create_draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Maintainers configure required reviewers on this Environment before publishing.
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Download verified archives
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          path: artifacts

      # Every release asset is versioned and target-specific except the single checksum manifest.
      # Keep downloads separate, then combine and verify all per-target checksums.
      - name: Collect release assets
        run: |
          mkdir -p release
          for directory in artifacts/release-*; do
            cp "$directory"/lore-* release/
            cat "$directory/SHA256SUMS" >> release/SHA256SUMS
          done
          LC_ALL=C sort -o release/SHA256SUMS release/SHA256SUMS
          cd release
          sha256sum -c SHA256SUMS

      - name: Write release notes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          release_version="${RELEASE_TAG#v}"
          sed \
            -e "s/__RELEASE_TAG__/$RELEASE_TAG/g" \
            -e "s/__RELEASE_VERSION__/$release_version/g" \
            scripts/release/release-notes.md > release-notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release already exists for $RELEASE_TAG; release assets are immutable"
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/* \
            --title "Lorelum $RELEASE_TAG" \
            --verify-tag \
            --draft \
            --prerelease \
            --notes-file release-notes.md
